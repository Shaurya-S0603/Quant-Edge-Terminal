[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantedge-research"
version = "0.1.0"
description = "Historical strategy backtesting and reproducible equity research for US and NSE markets"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["research/tests"]
addopts = "-q"
