name: QuantEdge checks

on:
  push:
    branches: [main, 'research/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-py312.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r research/requirements-py312.lock
      - name: Verify Python research and registry
        run: python -m pytest
      - name: Verify symbol replay
        run: node --test research/tests/test_symbol_replay.mjs
      - name: Check frontend modules
        run: |
          node --check research/site/app.js
          node --check research/site/tester.mjs
