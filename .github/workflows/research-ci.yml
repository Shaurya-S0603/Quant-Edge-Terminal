name: Historical Research Protocol

on:
  pull_request:
    paths:
      - "research/**"
      - "src/quantedge_research/**"
      - ".github/workflows/research-ci.yml"
  push:
    branches: ["research/**"]
    paths:
      - "research/**"
      - "src/quantedge_research/**"
      - ".github/workflows/research-ci.yml"

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements-py312.lock
      - name: Install the research lockfile
        run: python -m pip install --require-hashes -r research/requirements-py312.lock
      - name: Verify protocol with synthetic data
        run: python -m pytest research/tests
